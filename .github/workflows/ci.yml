name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint
      # The build generates Next.js route types (and next-env.d.ts) that the type check relies on.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      # End-to-end tests need the API and a seeded database (fitexaa-backend); see README.
